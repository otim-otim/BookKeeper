name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        database: [sqlite, mysql, pgsql]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
            pest: '^4.0'
          - laravel: '13.*'
            testbench: '^11.0'
            pest: '^5.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.database }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bookkeeper
          MYSQL_USER: bookkeeper
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret" --health-interval=5s --health-retries=20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bookkeeper
          POSTGRES_USER: bookkeeper
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U bookkeeper" --health-interval=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest }}"
          composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:${{ matrix.laravel }}" -W

      - name: Run tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
          DB_DATABASE: bookkeeper
          DB_USERNAME: bookkeeper
          DB_PASSWORD: secret
